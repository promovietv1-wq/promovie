<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>Telessaúde | Currículos</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#fff;color:#281e39;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{width:min(460px,100%);text-align:center}
  h1{font-size:1.5rem;line-height:1.3;margin:0 0 10px}
  p{font-size:1rem;line-height:1.55;color:#51465e;margin:0 0 22px}
  .actions{display:flex;flex-direction:column;gap:12px}
  button,a{appearance:none;display:block;border:0;border-radius:12px;padding:15px 18px;text-decoration:none;font:700 1rem inherit;cursor:pointer}
  button{background:#4b0c8f;color:white}
  a{background:#f2eef9;color:#4b0c8f}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1 id="heading">Abrindo os currículos</h1>
  <p id="message">Você será encaminhado à apresentação dos profissionais.</p>
  <div class="actions" id="return-actions" hidden>
    <button type="button" id="close-tab">Voltar às especialidades</button>
    <a href="/telessaude/">Abrir Telessaúde nesta aba</a>
  </div>
</main>
<script>
(function(){
  "use strict";
  // A tela médica permanece na aba de origem. O histórico desta aba
  // oferece um retorno após o uso de Voltar na página externa.
  const destination="https://profissionais-telessaude.vercel.app/?theme=light";
  let navigating=false;
  let returned=false;
  function showReturn(){
    if(returned)return;
    returned=true;
    document.getElementById("heading").textContent="Voltar às especialidades";
    document.getElementById("message").textContent="A Telessaúde continua aberta na aba anterior. Volte para aquela aba para escolher uma especialidade.";
    document.getElementById("return-actions").hidden=false;
    try{window.close()}catch{}
  }
  document.getElementById("close-tab").addEventListener("click",()=>{
    // Fechar a aba dos currículos preserva a sessão original.
    window.close();
    // Caso o navegador bloqueie o fechamento, mantém a orientação.
    document.getElementById("message").textContent="Retorne à aba anterior, onde suas especialidades continuam abertas.";
  });
  window.addEventListener("pageshow",event=>{
    // BFCache (iOS e outros): scripts não são executados novamente
    // quando o usuário volta ao documento intermediário.
    if(navigating&&event.persisted)showReturn();
  });
  if(history.state&&history.state.pvCurriculosBridge===true){
    showReturn();
    return;
  }
  try{
    history.replaceState({...((history.state&&typeof history.state==="object")?history.state:{}),pvCurriculosBridge:true},"",location.href);
  }catch{}
  navigating=true;
  location.assign(destination);
})();
</script>
</body>
</html>
