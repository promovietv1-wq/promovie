<svg xmlns="http://www.w3.org/2000/svg" width="178" height="29" viewBox="0 0 178 29" aria-label="Telessaúde">
  <!-- Letreiro exato da referência do usuário: alfa original tingido no roxo visível da PromoVie. -->
  <defs>
    <filter id="pv-purple-ink" color-interpolation-filters="sRGB" x="-5%" y="-10%" width="110%" height="120%">
      <feFlood flood-color="#4b0c8f" result="promoVieColor"/>
      <feComposite in="promoVieColor" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
  <image width="178" height="29" filter="url(#pv-purple-ink)" href="data:image/png;base64,"/>
</svg>