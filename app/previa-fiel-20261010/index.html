<script>
(function(){
"use strict";
var promptEvent=null;
var btn=document.getElementById("installBtn");
var modal=document.getElementById("installModal");
var steps=document.getElementById("steps");
var choices=[...document.querySelectorAll(".pvDeviceChoice")];
var android=/Android/i.test(navigator.userAgent);
var embedded=["Instagram","FBAN","FBAV","WhatsApp","FB_IAB"].some(function(t){return navigator.userAgent.includes(t);})||navigator.userAgent.includes("; wv)");
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();promptEvent=e;});
window.addEventListener("appinstalled",function(){btn.querySelector("span").textContent="Aplicativo instalado";promptEvent=null;});
function openModal(){
 steps.hidden=true;steps.innerHTML="";
 choices.forEach(function(c){c.classList.remove("active");c.setAttribute("aria-pressed","false");});
 if(modal.showModal)modal.showModal();else modal.setAttribute("open","");
 choices[0].focus();
}
function showSteps(html){steps.innerHTML=html;steps.hidden=false;}
function close(){if(modal.close)modal.close();else modal.removeAttribute("open");btn.focus();}
btn.addEventListener("click",openModal);
choices.forEach(function(choice){choice.addEventListener("click",async function(){
 var platform=choice.getAttribute("data-platform");
 choices.forEach(function(c){var active=c===choice;c.classList.toggle("active",active);c.setAttribute("aria-pressed",active?"true":"false");});
 if(platform==="iphone"){
  showSteps("<p><strong>Instalação no iPhone</strong></p><ol><li>Abra esta página no <strong>Safari</strong> do iPhone.</li><li>Toque em <strong>Compartilhar</strong>.</li><li>Selecione <strong>Adicionar à Tela de Início</strong> e confirme.</li></ol><p>Depois, abra pelo ícone instalado para acessar como aplicativo, sem a barra de endereço.</p>");
  return;
 }
 if(!android){
  showSteps("<p><strong>Instalação no Android</strong></p><p>Abra esta página no <strong>Chrome de um celular Android</strong> e toque em <strong>Instalar aplicativo</strong> para continuar.</p>");
  return;
 }
 if(embedded){
  showSteps("<p>Abra esta página no <strong>Chrome do Android</strong>, fora do WhatsApp ou de outro aplicativo, e toque novamente em <strong>Instalar aplicativo</strong>.</p>");
  return;
 }
 if(promptEvent){
  var p=promptEvent;promptEvent=null;
  try{
   await p.prompt();
   var answer=await p.userChoice;
   if(answer&&answer.outcome==="accepted"){close();return;}
  }catch(e){}
 }
 showSteps("<p><strong>Instalação no Android</strong></p><ol><li>Abra esta página no <strong>Chrome</strong>.</li><li>No menu <strong>⋮</strong>, escolha <strong>Instalar aplicativo</strong> ou <strong>Adicionar à tela inicial</strong>.</li><li>Confirme e abra pelo ícone do aplicativo.</li></ol>");
});});
document.getElementById("closeModal").addEventListener("click",close);
document.getElementById("modalDone").addEventListener("click",close);
modal.addEventListener("click",function(e){if(e.target===modal)close();});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/app/previa-fiel-20261010/sw.js",{scope:"/app/previa-fiel-20261010/"}).catch(function(){});});}
})();
</script></body></html>
