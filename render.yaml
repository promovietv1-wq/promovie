# PromoVie | TeleSaúde — App Teste Novo 2
# O Render cria um servidor Node.js de homologação no plano GRATUITO.
# Não usar com pacientes reais. Nunca armazenar Secret Key ou senhas no GitHub.
services:
  - type: web
    name: promovie-mediquo-homologacao
    runtime: node
    plan: free
    autoDeployTrigger: off
    rootDir: app-teste-novo-2-backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/mediquo/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://www.promovie.tv.br,https://promovie.tv.br
      - key: MEDIQUO_TEST_PATIENT_CODE
        value: promovie-homologacao-001
      # Chaves e URL do Staging são configuradas PRIVADAMENTE no painel Render
      # somente após a confirmação do Pedro. O backend inicia em modo seguro
      # de "aguardando-configuracao" até todos os valores estarem presentes.
