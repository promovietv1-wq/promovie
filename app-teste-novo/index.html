<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>TeleSaúde | App Teste Novo</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#213048;background:#f8fafc}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 10%,#e0f3f5 0,transparent 49%),#f8fafc}
    header{min-height:86px;background:#fff;border-bottom:1px solid #e6edf3;padding:13px max(20px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}
    header img{width:170px;max-width:44vw;height:auto;display:block}
    header small{font-size:11px;color:#63768b;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    main{width:min(1060px,100%);min-height:calc(100vh - 150px);margin:auto;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:45px 25px}
    .tag{text-transform:uppercase;letter-spacing:.15em;color:#138a94;font-weight:700;font-size:12px}
    h1{font-size:clamp(36px,5vw,59px);letter-spacing:-.04em;line-height:1.1;margin:20px 0;color:#20334e}
    h1 strong{background:linear-gradient(110deg,#168ba3,#5273c1);background-clip:text;-webkit-background-clip:text;color:transparent}
    p{font-size:18px;line-height:1.65;color:#5d6e80}
    button{display:inline-flex;align-items:center;justify-content:center;min-height:54px;border:0;border-radius:14px;background:linear-gradient(120deg,#0e7692,#176bb2);box-shadow:0 10px 28px #167ba328;color:#fff;font-size:16px;font-weight:700;padding:14px 27px;cursor:pointer}
    button:disabled{opacity:.75;cursor:wait}
    button:focus-visible{outline:3px solid #12a2b8;outline-offset:3px}
    #status{margin-top:15px;color:#a3414c;font-size:13px;line-height:1.5}
    #status[hidden]{display:none}
    .visual{position:relative;display:grid;place-items:center;min-height:330px}
    .visual::before{content:"";position:absolute;width:320px;max-width:90%;aspect-ratio:1;border-radius:50%;background:#eaf6f6;box-shadow:0 0 0 40px #e9f3f577}
    .visual img{position:relative;width:min(330px,90%);height:auto;filter:drop-shadow(0 13px 15px #13304b22)}
    footer{text-align:center;font-size:12px;color:#8291a3;padding:20px}
    @media(max-width:720px){header{padding:14px 18px}main{grid-template-columns:1fr;gap:15px;text-align:center;padding:38px 24px}.visual{min-height:230px;grid-row:1}.visual img{width:min(230px,60vw)}.visual::before{width:min(220px,59vw);box-shadow:0 0 0 25px #e9f3f577}h1{font-size:clamp(34px,9vw,44px)}p{font-size:16px}}
  </style>
</head>
<body>
  <header>
    <a href="/" aria-label="PromoVie - Página inicial"><img src="/preview-promovie-logo.webp" alt="PromoVie" width="170"></a>
    <small>Homologação</small>
  </header>
  <main>
    <section>
      <div class="tag">TeleSaúde</div>
      <h1>Saúde e acolhimento <strong>onde você estiver.</strong></h1>
      <p>Converse online com profissionais de saúde.</p>
      <button id="open-care" type="button" disabled><span>Acessar telemedicina</span></button>
      <p id="status" role="status" aria-live="polite" hidden></p>
    </section>
    <div class="visual" aria-hidden="true"><img src="/app/assets/coracao-promovie-com-logo.webp" width="330" height="330" alt=""></div>
  </main>
  <footer>PromoVie | Teste independente de integração</footer>
  <script src="https://widget.mediquo.com/js/1.0.0/mediquo.js"></script>
  <script>
    (function () {
      "use strict";
      // Implementação adaptada do frontend-simples/index.html do kit enviado pela Médiquo.
      // A Secret Key NÃO pertence ao frontend.
      const API_KEY="8cwnN2BA4nslSfhI";
      const btn=document.getElementById("open-care");
      const label=btn.querySelector("span");
      const aviso=document.getElementById("status");
      let connecting=false;
      let initialized=false;
      let attempted=false;
      let errorTimer=null;

      function feedback(text){
        if(errorTimer){clearTimeout(errorTimer);errorTimer=null;}
        aviso.textContent=text||"";
        aviso.hidden=!text;
        if(text){
          errorTimer=setTimeout(function(){
            aviso.textContent="";
            aviso.hidden=true;
            errorTimer=null;
          },7000);
        }
      }

      async function openCare(){
        if(connecting)return;
        connecting=true;
        attempted=true;
        btn.disabled=true;
        label.textContent="Conectando...";
        feedback("");
        try{
          if(!window.MediquoWidget ||
             typeof window.MediquoWidget.init!=="function" ||
             typeof window.MediquoWidget.open!=="function"){
            throw new Error("O Widget Web não foi carregado.");
          }
          // Exatamente o fluxo sem sessão do kit: somente API Key, título e cor.
          // Não enviar adapter, environment, accessToken ou Secret Key.
          if(!initialized){
            await Promise.resolve(window.MediquoWidget.init({
              apiKey:API_KEY,
              theme:{
                text:{title:"TeleSaude"},
                colors:{primary:"#4b0c8f"}
              }
            }));
            initialized=true;
          }
          await Promise.resolve(window.MediquoWidget.open());
          feedback(""); // Nenhum aviso persistente após abrir/fechar a janela.
        }catch(e){
          initialized=false;
          feedback("Não foi possível abrir o atendimento. Se o acesso não estiver liberado, a Médiquo deve validar a API Key e este domínio.");
        }finally{
          connecting=false;
          btn.disabled=false;
          label.textContent="Acessar telemedicina";
        }
      }

      window.addEventListener("unhandledrejection",function(event){
        if(!attempted)return;
        const message=String(event.reason&&(event.reason.message||event.reason)||"");
        if(/Not valid API Key|invalid api.?key|unauthori[sz]ed|invalid credential/i.test(message)){
          feedback("A Médiquo recusou a API Key. É necessário confirmar a chave e a autorização do domínio www.promovie.tv.br.");
        }else if(/CORS|Failed to fetch|NetworkError|ERR_FAILED|Load failed/i.test(message)){
          feedback("Não foi possível conectar aos serviços de telemedicina.");
        }
      });

      btn.disabled=false;
      btn.addEventListener("click",openCare);
    })();
  </script>
</body>
</html>
