name: Gerar imagem de compartilhamento da Telessaude
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gerar-previa-telesaude.yml'
permissions:
  contents: write
jobs:
  criar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: python -m pip install --quiet pillow
      - name: Combinar coracao e lettering original, sem alterar marcas
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          W,H=1200,630
          out=Path('telesaude/assets/telesaude-compartilhamento.png')
          out.parent.mkdir(parents=True,exist_ok=True)
          base=Image.new('RGBA',(W,H),(255,255,255,255))
          heart=Image.open('app/assets/coracao-promovie-com-logo.webp').convert('RGBA')
          word=Image.open('telessaude/teste-aceite/assets/telessaude-lettering.png').convert('RGBA')
          heart.thumbnail((260,260),Image.Resampling.LANCZOS)
          word.thumbnail((550,180),Image.Resampling.LANCZOS)
          # Fundo branco uniforme. Preserva tamanho, posicao e proporcao das marcas originais.
          if word.width<530:
             word=word.resize((530,round(530*word.height/word.width)),Image.Resampling.LANCZOS)
          hx=210+(260-heart.width)//2
          hy=(H-heart.height)//2
          wx=510
          wy=(H-word.height)//2
          base.alpha_composite(heart,(hx,hy))
          base.alpha_composite(word,(wx,wy))
          base.convert('RGB').save(out,'PNG',optimize=True)
          assert Image.open(out).size==(W,H)
          print('Generated:',out,'PNG bytes:',out.stat().st_size,'heart:',heart.size,'lettering:',word.size)
          PY
      - name: Publicar imagem de compartilhamento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telesaude/assets/telesaude-compartilhamento.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(telessaude): remove moldura circulo e sombras do preview"
            git push origin HEAD:main
          fi
