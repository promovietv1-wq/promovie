name: Gerar imagem de compartilhamento da Telessaude
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gerar-previa-telesaude.yml'
permissions:
  contents: write
jobs:
  criar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: python -m pip install --quiet pillow
      - name: Preparar o coracao oficial sem alterar a imagem original
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          W,H=1200,630
          out=Path('telesaude/assets/preview-coracao-promovie.png')
          out.parent.mkdir(parents=True,exist_ok=True)
          source=Image.open('app/assets/coracao-promovie-com-logo.webp').convert('RGBA')
          # Somente o coração original da PromoVie, com sua marca interna.
          # Dimensionar preserva a proporção e os pixels da arte.
          size=430
          ratio=min(size/source.width,size/source.height)
          heart=source.resize((round(source.width*ratio),round(source.height*ratio)),Image.Resampling.LANCZOS)
          base=Image.new('RGBA',(W,H),(255,255,255,255))
          base.alpha_composite(heart,((W-heart.width)//2,(H-heart.height)//2))
          base.convert('RGB').save(out,'PNG',optimize=True)
          assert Image.open(out).size==(W,H)
          print('Official PromoVie heart reused:',out,'bytes:',out.stat().st_size,
                'original dimensions:',source.size,'preview:',heart.size)
          PY
      - name: Publicar imagem de compartilhamento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telesaude/assets/preview-coracao-promovie.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(telessaude): usa somente o coracao oficial no compartilhamento"
            git push origin HEAD:main
          fi
