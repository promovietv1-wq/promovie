name: Telessaude oficial validar aceite e especialidades
on:
  push:
    branches: [main]
    paths:
      - 'telessaude/index.html'
      - 'telessaude/atendimento/index.html'
      - 'telessaude/informacoes/index.html'
      - 'telessaude/diretorio.mjs'
      - 'telessaude/assets/**'
      - '.github/scripts/validate-telessaude-oficial.mjs'
      - '.github/workflows/validate-telessaude-oficial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar arquivos da versao oficial
        run: |
          node --check telessaude/diretorio.mjs
          node --check .github/scripts/validate-telessaude-oficial.mjs
      - name: Instalar navegador de teste
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Testar leitura unica e navegacao sem servicos medicos reais
        run: |
          python -m http.server 8779 --bind 127.0.0.1 >/tmp/pv-telessaude-oficial.log 2>&1 &
          sleep 2
          node .github/scripts/validate-telessaude-oficial.mjs
