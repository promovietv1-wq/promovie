name: One-time Wix Portfolio Audit
on:
  push:
    paths:
      - ".github/workflows/wix-portfolio-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-page-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public Wix portfolio without changing production
        shell: bash
        run: |
          python3 - <<'PY'
          import re,json,html,time,urllib.request,urllib.error
          targets=[
            "https://polesevideo.wixsite.com/promovie/smart-films",
            "https://polesevideo.wixsite.com/promovie/",
          ]
          headers={
            "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36",
            "Accept":"text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
            "Accept-Language":"pt-BR,pt;q=0.9,en;q=0.7"
          }
          for url in targets:
            print("\n=== START",url,"===")
            try:
              request=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(request,timeout=35) as response:
                data=response.read(12000000)
                print("HTTP",response.status,"FINAL_URL",response.url,"BYTES",len(data),"TYPE",response.headers.get("Content-Type"))
              s=data.decode("utf-8",errors="replace")
              variants=[s,html.unescape(s),html.unescape(s).replace("\\/","/"),html.unescape(s).replace("\\u002F","/").replace("\\u003A",":")]
              joined="\n".join(variants)
              title=re.search(r"<title[^>]*>(.*?)</title>",s,re.I|re.S)
              print("TITLE",html.unescape(re.sub("<[^>]*>","",title.group(1)))[:200] if title else "<missing>")
              print("HTML_HEAD",repr(s[:550]))
              pats={
                "wix_video_files":r"https?://video[.]wixstatic[.]com/video/[a-zA-Z0-9_./?=&%-]+",
                "wix_media_video_ids":r"(?:wix:video://v1/|video/)[a-zA-Z0-9_-]{15,}",
                "mp4_refs":r"https?://[^\s\\"'<>]+[.]mp4(?:\?[^\s\\"'<>]+)?",
                "wix_poster_files":r"https?://static[.]wixstatic[.]com/media/[a-zA-Z0-9_~./?=&%-]+",
                "youtube_vimeo":r"https?://(?:www[.])?(?:youtube[.]com|youtu[.]be|vimeo[.]com)/[^\s\\"'<>]+",
              }
              for key,pattern in pats.items():
                vals=[]
                for match in re.finditer(pattern,joined,re.I):
                  v=match.group(0).rstrip(".,;")
                  if v not in vals: vals.append(v)
                print("RESULT",key,len(vals))
                for idx,v in enumerate(vals[:150]):print(key,idx+1,v[:350])
              for mark in ["wix:video://","videoId","videoUrl","mediaId","smart-films","WixVideo","videoPlayer"]:
                matches=list(re.finditer(re.escape(mark),s,re.I))
                print("MARK",mark,len(matches))
                for match in matches[:4]:
                  print("CONTEXT",mark,repr(s[max(0,match.start()-130):match.end()+190]))
            except Exception as e:
              print("ERROR",type(e).__name__,str(e))
            print("=== END ===")
          PY
