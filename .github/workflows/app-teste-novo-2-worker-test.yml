name: App Teste Novo 2 - Cloudflare Worker (simulado)
on:
  push:
    paths:
      - 'app-teste-novo-2-worker/**'
      - '.github/workflows/app-teste-novo-2-worker-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes locais sem credenciais reais
        run: npm test
        working-directory: app-teste-novo-2-worker
