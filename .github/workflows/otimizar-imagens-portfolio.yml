name: Preparar miniaturas otimizadas do portfolio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/otimizar-imagens-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: python -m pip install --quiet pillow
      - name: Copiar imagens originais e otimizar apenas a compressao
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from PIL import Image, ImageOps
          from io import BytesIO
          import re, time
          html=Path('audiovisual/index.html').read_text(encoding='utf-8')
          from html.parser import HTMLParser
          class ImageExtractor(HTMLParser):
            def __init__(self):
              super().__init__()
              self.images=[]
            def handle_starttag(self,tag,attrs):
              if tag!='img': return
              src=dict(attrs).get('src','')
              if src.startswith('https://static.wixstatic.com/media/279d86_') and src.endswith('.jpg'):
                self.images.append(src)
          parser=ImageExtractor()
          parser.feed(html)
          urls=list(dict.fromkeys(parser.images))
          assert len(urls)==27, f'Esperadas 27 capas, encontradas {len(urls)}'
          folder=Path('audiovisual/thumbs')
          folder.mkdir(parents=True,exist_ok=True)
          def prepare(url):
            filename=url.rsplit('/',1)[-1].removesuffix('.jpg')+'.webp'
            path=folder/filename
            if path.is_file() and path.stat().st_size>1000:
              Image.open(path).verify()
              return (filename,path.stat().st_size,'existing')
            last=None
            for i in range(3):
              try:
                req=Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; PromoVieSiteAssetOptimization/1.0)','Accept':'image/avif,image/webp,image/jpeg,image/*;q=0.8'})
                with urlopen(req,timeout=24) as r:
                  if r.status!=200: raise RuntimeError(f'HTTP {r.status}')
                  data=r.read(18*1024*1024)
                  if len(data)>=18*1024*1024: raise RuntimeError('Image exceeds size limit')
                image=Image.open(BytesIO(data))
                image=ImageOps.exif_transpose(image).convert('RGB')
                image.thumbnail((720,520),Image.Resampling.LANCZOS)
                assert image.width>100 and image.height>100
                image.save(path,'WEBP',quality=78,method=5)
                return (filename,path.stat().st_size,str(image.size))
              except Exception as e:
                last=e
                time.sleep(1+i)
            raise RuntimeError(f'{filename}: {last}')
          with ThreadPoolExecutor(max_workers=5) as pool:
            futures=[pool.submit(prepare,url) for url in urls]
            for f in as_completed(futures):
              print('Optimized',*f.result(),flush=True)
          total=sum(x.stat().st_size for x in folder.glob('*.webp'))
          assert len(list(folder.glob('*.webp')))>=27
          print('PASS: 27 original images copied to lightweight local thumbnails',total,'bytes',flush=True)
          PY
      - name: Publicar arquivos estaticos sem mudar o site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audiovisual/thumbs/
          if ! git diff --cached --quiet; then
            git commit -m "assets: miniaturas locais otimizadas de audiovisual"
            git push origin HEAD:main
          fi
