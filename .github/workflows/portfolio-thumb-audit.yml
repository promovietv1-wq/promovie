name: Portfolio thumbnail color audit
on:
  push:
    paths:
      - .github/workflows/portfolio-thumb-audit.yml
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Analyze color and white-space of original video covers
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 - <<'PY'
          import json,urllib.request,io,math
          from PIL import Image,ImageStat,ImageFilter
          with open("previews/portfolio/wix-videos.json",encoding="utf8") as f:items=json.load(f)["items"]
          def study(entry):
           u=entry["poster"]+"/v1/fill/w_420,h_236,al_c,q_82,enc_jpg/file.jpg"
           req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
           try:
            with urllib.request.urlopen(req,timeout=15) as f:
             data=f.read()
            image=Image.open(io.BytesIO(data)).convert("RGB")
            pix=list(image.resize((80,45)).getdata())
            luma=[(r+g+b)/3 for r,g,b in pix]
            blank=sum(1 for r,g,b in pix if r>237 and g>237 and b>237)/len(pix)
            pale=sum(1 for r,g,b in pix if r>211 and g>211 and b>211)/len(pix)
            bright=sum(1 for y in luma if y>224)/len(luma)
            sat=sum((max(p)-min(p))/max(1,max(p)) for p in pix)/len(pix)
            contrasts=(sum((a-sum(luma)/len(luma))**2 for a in luma)/len(luma))**0.5
            return dict(position=entry["position"],id=entry["id"],white=round(blank,3),pale=round(pale,3),bright=round(bright,3),saturation=round(sat,3),contrast=round(contrasts,1),bytes=len(data),dimensions=list(image.size))
           except Exception as e:return dict(position=entry["position"],error=str(e))
          from concurrent.futures import ThreadPoolExecutor
          with ThreadPoolExecutor(max_workers=10) as e:results=list(e.map(study,items))
          for item in results:print("THUMBNAIL_AUDIT",json.dumps(item))
          
          PY