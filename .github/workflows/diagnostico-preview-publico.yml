name: Validar preview publico Telessaude (temporario)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico-preview-publico.yml']
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validar metadata social no HTML publicado e imagem publica
        run: |
          python - <<'PY'
          import urllib.request,re,struct
          base='https://www.promovie.tv.br'
          paths=['/telessaude/','/telessaude/teste-aceite/','/telesaude/']
          agents=['facebookexternalhit/1.1','WhatsApp/2.24.24','Mozilla/5.0']
          img=base+'/telesaude/assets/telesaude-compartilhamento.png?pv=20261111-preview2'
          for path in paths:
            for agent in agents:
              url=base+path
              req=urllib.request.Request(url,headers={'User-Agent':agent})
              with urllib.request.urlopen(req,timeout=14) as response:
                body=response.read(100000).decode('utf-8','replace')
                assert response.status==200
                assert 'property="og:title"' in body
                assert 'property="og:image"' in body
                assert img in body
                robots=re.findall(r'<meta name="robots" content="([^"]+)"',body)
                assert robots and not any('noindex' in x for x in robots), (path,robots)
                print('PASS HTML',agent,path, 'og:image',img,'robots',robots)
          for agent in agents:
            req=urllib.request.Request(img,headers={'User-Agent':agent})
            with urllib.request.urlopen(req,timeout=14) as response:
              png=response.read()
              assert response.status==200
              assert response.headers.get('Content-Type','').startswith('image/png')
              assert png[:8]==bytes([137,80,78,71,13,10,26,10])
              width,height=struct.unpack('>II',png[16:24])
              assert (width,height)==(1200,630),(width,height)
              assert len(png)<500000,len(png)
              print('PASS IMAGE',agent,(width,height),'bytes',len(png))
          print('PUBLIC PREVIEW REQUIREMENTS VALIDATED')
          PY
