name: Investigar metodos publicos do widget (somente pesquisa)
on:
  push:
    branches:
      - research/mediquo-widget-navigation-20261107
    paths:
      - research/inspect-widget.mjs
      - research/inspect-routing.mjs
      - research/inspect-route-deep.mjs
      - research/inspect-auth-routing.mjs
      - research/simulate-widget-room.mjs
      - .github/workflows/investigar-widget-publico.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  read-only-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador de analise
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Analisar biblioteca publica sem autenticar pacientes
        run: node research/inspect-widget.mjs
      - name: Analisar roteamento publico do widget sem sessao de paciente
        run: node research/inspect-routing.mjs
      - name: Mapear rotas do modulo principal sem login
        run: node research/inspect-route-deep.mjs
      - name: Estudar autenticacao e equivalencia das listas no codigo publico
        run: node research/inspect-auth-routing.mjs
      - name: Testar rota interna com paciente inteiramente simulado
        run: node research/simulate-widget-room.mjs
      - name: Guardar resultado somente nesta ramificacao de pesquisa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/widget-navigation-inspection.md research/widget-routing-inspection.md research/widget-routing-deep.md research/widget-auth-routing-inspection.md research/widget-simulated-room-test.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(research): registrar comportamento publico do widget"
            git push origin HEAD:research/mediquo-widget-navigation-20261107
          fi
