name: Recuperar publicacao travada do GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recuperar-publicacao-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  liberar-fila:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Cancelar somente o deploy antigo identificado como travado
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STALE_SHA: 1bdbe87291c802a973b2417f90a3c28c4ed33f48
        shell: bash
        run: |
          set -euo pipefail
          # O deploy de 1bdbe... falhou, mas o GitHub Pages o deixou como
          # "in progress", bloqueando as publicacoes seguintes.
          # Esta rotina nao cancela nenhuma publicacao de outro commit.
          echo "Verificando deploy antigo do Pages: ${STALE_SHA}"
          status="$(gh api -H 'Accept: application/vnd.github+json' "repos/${REPO}/pages/deployments/${STALE_SHA}" --jq '.status')"
          echo "Situacao registrada pelo GitHub: ${status}"
          case "${status}" in
            succeed|success)
              echo "Publicacao ja finalizada; nenhuma alteracao necessaria."
              ;;
            *)
              gh api -X POST -H 'Accept: application/vnd.github+json' "repos/${REPO}/pages/deployments/${STALE_SHA}/cancel"
              echo "Solicitacao de cancelamento do deploy antigo concluida."
              ;;
          esac
