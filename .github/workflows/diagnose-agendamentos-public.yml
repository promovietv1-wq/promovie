name: Diagnostico publico do painel de agendamentos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-agendamentos-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Conferir redirecionamento e recursos publicos, sem autenticar
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, re
          for url in ('https://tinyurl.com/agendamq', 'https://painel-agendazap.vercel.app/'):
              print('PAGE:',url)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 PromoVie-public-resource-check'})
                  with urllib.request.urlopen(req,timeout=12) as response:
                      text=response.read(180000).decode('utf-8','replace')
                      print('Status:',response.status,'Final URL:',response.url)
                      print('Frame policy:',response.headers.get('x-frame-options'))
                      print('CSP:',(response.headers.get('content-security-policy')or'')[:300])
                      print('Page title:',re.findall(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)[:2])
                      for src in re.findall(r'(?:src|href)=[\"\']([^\\"\']+)[\"\']',text,re.I):
                          if src.startswith('/') or '.css' in src or '.js' in src:
                              print('Static link:',src[:180])
                      print('Themes:',[(w,text.lower().count(w))for w in ['theme','light','dark']])
              except Exception as e:print('Probe error:',type(e).__name__,str(e)[:250])
          PY
      - name: Inspecionar como o painel publico decide o tema
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,re
          host='https://painel-agendazap.vercel.app/'
          for page in ['', 'css/style.css','js/app.js']:
            url=host+page
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=12) as r:
                content=r.read(450000).decode('utf-8','replace')
              print('ASSET',page or 'index.html','bytes',len(content))
              if not page:print('HTML',content[:20000])
              else:
                for term in ('theme','dark','light','localStorage','fetch(','sessionStorage','API_URL','mode','data-theme','background'):
                  matches=list(re.finditer(re.escape(term),content,re.I))
                  print('TERM',term,'COUNT',len(matches))
                  for match in matches[:5]:
                    x=match.start()
                    print('SNIP',repr(content[max(0,x-180):x+260]))
            except Exception as e:print('ERR',page,str(e)[:120])
          PY
