name: Telessaude principal com dois esses
on:
  pull_request:
    paths:
      - 'telessaude/**'
      - 'telesaude/meu-espaco/space.js'
      - '.github/scripts/validate-telessaude-principal.mjs'
      - '.github/workflows/telessaude-principal.yml'
  push:
    branches: [main, release/telessaude-principal-dois-esses-20261109]
    paths:
      - 'telessaude/**'
      - 'telesaude/meu-espaco/space.js'
      - '.github/scripts/validate-telessaude-principal.mjs'
      - '.github/workflows/telessaude-principal.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe
        run: |
          node --check telessaude/pwa-install.js
          node --check telessaude/sw.js
          node --check telesaude/meu-espaco/space.js
          node --check .github/scripts/validate-telessaude-principal.mjs
      - name: Instalar navegador de testes
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verificar entrada, atendimento, botões e responsividade
        run: |
          python -m http.server 8779 --bind 127.0.0.1 >/tmp/pv-telessaude-principal.log 2>&1 &
          sleep 2
          node .github/scripts/validate-telessaude-principal.mjs
