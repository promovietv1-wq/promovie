<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-store">
<title>Atendimentos | TeleSaúde PromoVie</title>
<link rel="icon" type="image/webp" href="/app/assets/coracao-promovie-com-logo.webp?v=transparente-1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script defer src="/telesaude/space-entry.js"></script>
<style>
:root{
  color-scheme:light;
  --bar-h:76px;
  --space-h:0px;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-synthesis:none;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#fff}
body{overflow:hidden;color:#302349}
a{color:inherit}
button{font:inherit}
.topbar{
  position:fixed;inset:0 0 auto;height:var(--bar-h);
  padding:0 max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left));
  background:linear-gradient(112deg,#fff 0%,#fbf9ff 55%,#f0eafd 100%);
  border-bottom:1px solid #e8def5;
  box-shadow:0 5px 24px rgba(59,26,112,.075);
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  isolation:isolate;overflow:hidden;z-index:2147483640;
}
/* Identidade institucional, visível também acima do atendimento no mobile. */
.topbar::before{
  content:"";position:absolute;inset:0 0 auto;height:3px;
  background:linear-gradient(90deg,#4b0c8f 0%,#7334d8 58%,#00bde8 100%);
  pointer-events:none
}
.topbar::after{
  content:"";position:absolute;right:15%;top:-128px;width:310px;height:250px;
  border:1px solid rgba(115,52,216,.10);border-radius:50%;
  box-shadow:0 0 0 26px rgba(115,52,216,.027),
             0 0 0 72px rgba(115,52,216,.017);
  pointer-events:none;z-index:0
}
.identity{display:flex;align-items:center;gap:13px;min-width:0;position:relative;z-index:1}
.identity img{
  display:block;width:56px;height:56px;object-fit:contain;flex:none;
  filter:drop-shadow(0 5px 9px rgba(85,27,156,.13))
}
.identity-copy{min-width:0;display:flex;align-items:center}
.identity-copy strong{
  font-size:19px;line-height:1.22;font-weight:800;letter-spacing:-.035em;
  color:#3f197a;white-space:nowrap
}
.back{
  position:relative;z-index:1;
  display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;min-width:40px;flex:0 0 40px;
  border:1px solid #ded5ee;border-radius:12px;
  background:#fff;color:#542aa0;text-decoration:none;
}
.back:hover,.back:focus-visible{background:#f7f3fd;border-color:#bda8df}
.back:focus-visible{outline:3px solid #00bde8;outline-offset:3px}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root.space-link-ready{--space-h:83px}
/* Barra institucional fora do widget: não envolve, intercepta ou altera o SDK. */
.space-footer[hidden]{display:none!important}
.space-footer{
  position:fixed;inset:auto 0 0;height:var(--space-h);
  z-index:1100;display:flex;justify-content:center;align-items:center;
  padding:8px max(14px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  border-top:1px solid #e6dff0;
  background:linear-gradient(108deg,#fbfaff 0%,#f6f3fd 48%,#f1f7ff 100%);
  box-shadow:0 -3px 18px rgba(48,27,87,.04)
}
.space-entry{
  display:flex;align-items:center;gap:11px;width:min(390px,100%);
  min-height:58px;padding:10px 14px;
  border:1px solid #dfd4ef;border-radius:15px;background:#fff;
  text-align:left;text-decoration:none;color:#52248e;
  box-shadow:0 2px 12px rgba(69,38,116,.045)
}
.space-entry:hover{border-color:#bea3e2;background:#faf7ff}
.space-entry:focus-visible{outline:3px solid #00bde8;outline-offset:2px}
.space-entry svg{
  width:23px;height:23px;flex:none;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round
}
.space-entry .space-entry-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:2px}
.space-entry strong{font-size:12.5px;font-weight:800;line-height:1.32}
.space-entry small{font-size:10.5px;color:#766c85;line-height:1.35}
.space-entry svg.space-arrow{height:17px;width:17px;opacity:.66}
@media(max-width:700px){
  .space-footer{padding:5px 13px max(5px,env(safe-area-inset-bottom))}
  .space-entry{min-height:55px;border-radius:13px;padding:8px 12px}
  .space-entry small{font-size:10px}
}
.stage{position:fixed;inset:var(--bar-h) 0 var(--space-h);background:#fff}
.status{
  position:absolute;inset:0;padding:24px;
  display:grid;place-items:center;z-index:1;background:#fff;
}
.status[hidden]{display:none}
.status-card{width:min(420px,100%);text-align:center}
.status-icon{
  display:grid;place-items:center;margin:0 auto 20px;
  width:62px;height:62px;border-radius:20px;
  background:linear-gradient(142deg,#eee7fb,#f5f1fc);
  color:#542aa0;font-size:27px;font-weight:800;
}
.status-card h1{font-size:21px;line-height:1.28;letter-spacing:-.03em;margin:0 0 10px}
.status-card p{font-size:13px;line-height:1.65;color:#756e80;margin:0}
.status-card a{
  display:inline-flex;justify-content:center;margin-top:24px;padding:13px 20px;
  background:#5424a0;color:#fff;border-radius:12px;
  font-size:13px;font-weight:700;text-decoration:none;
}
.status-card a[hidden]{display:none}
.loading .status-icon{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.7;transform:scale(.96)}}
/* A Médiquo controla o conteúdo interno. Estilizamos somente o contêiner externo.
   Os nomes de contêiner são do Widget; nunca alteramos o iframe de atendimento. */
html body #MediquoContainer,
html body .MediquoContainer,
html body #mediquo-container,
html body .mediquo-container,
html body [id^="MediquoContainer"],
html body [class~="MediquoContainer"]{
  position:fixed!important;
  top:var(--bar-h)!important;right:0!important;bottom:var(--space-h)!important;left:0!important;
  width:100vw!important;max-width:none!important;min-width:0!important;
  height:calc(100vh - var(--bar-h) - var(--space-h))!important;
  height:calc(100dvh - var(--bar-h) - var(--space-h))!important;
  max-height:none!important;min-height:0!important;
  margin:0!important;padding:0!important;border:0!important;
  border-radius:0!important;box-shadow:none!important;
  transform:none!important;z-index:1000!important;
  overflow:hidden!important;background:#fff!important;
}
html body #MediquoContainer iframe,
html body .MediquoContainer iframe,
html body #mediquo-container iframe,
html body .mediquo-container iframe{
  display:block!important;width:100%!important;height:100%!important;
  max-width:none!important;max-height:none!important;border:0!important;border-radius:0!important;
}
html body #MediquoLauncher,
html body .MediquoLauncher,
html body #mediquo-launcher,
html body .mediquo-launcher{display:none!important}
@media(max-width:700px){
  :root{--bar-h:62px}
  :root.space-link-ready{--space-h:76px}
  .topbar{gap:8px;padding-inline:max(12px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-right))}
  .topbar::after{right:7%;top:-133px;width:210px;height:190px;opacity:.6}
  .identity{gap:8px;min-width:0}
  .identity img{width:43px;height:43px}
  .identity-copy strong{font-size:13.5px;letter-spacing:-.035em}
  .back{width:38px;height:38px;min-width:38px;flex-basis:38px}
  .back svg{width:17px;height:17px}
}
@media(max-width:360px){
  .topbar{padding-inline:9px;gap:6px}
  .identity{gap:5px}
  .identity img{width:40px;height:40px}
  .identity-copy strong{font-size:12px}

}
/* Composição exclusiva para telas amplas.
   Centralizamos somente o contêiner externo do widget. O SDK, seu iframe,
   formulários, navegação e sessões permanecem integralmente sob controle da Médiquo. */
@media (min-width:1100px){
  body{background:#f7f5fb}
  .topbar{
    padding-left:max(28px,calc((100vw - 1180px)/2));
    padding-right:max(28px,calc((100vw - 1180px)/2))
  }
  /* Fundo contínuo azul e roxo, sem formas, texturas ou sobreposições. */
  .stage{
    background:linear-gradient(110deg,#eff9ff 0%,#f8f7ff 46%,#f3edfc 100%)
  }
  html body #MediquoContainer,
  html body .MediquoContainer,
  html body #mediquo-container,
  html body .mediquo-container,
  html body [id^="MediquoContainer"],
  html body [class~="MediquoContainer"]{
    left:50%!important;right:auto!important;
    width:min(1180px,calc(100vw - 96px))!important;
    max-width:1180px!important;
    transform:translateX(-50%)!important;
    border-left:1px solid #ebe5f4!important;
    border-right:1px solid #ebe5f4!important;
    box-shadow:0 20px 60px rgba(55,35,95,.09)!important
  }
}
@media(prefers-reduced-motion:reduce){.loading .status-icon{animation:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="identity">
    <img src="/app/assets/coracao-promovie-com-logo.webp?v=transparente-1" width="56" height="56" alt="Coração PromoVie">
    <div class="identity-copy">
      <strong>TeleSaúde PromoVie</strong>
    </div>
  </div>
  <a class="back" href="/telesaude/" id="back-access" aria-label="Sair e voltar ao acesso" title="Sair">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </a>
</header>
<main class="stage" aria-label="Área de atendimentos">
  <section id="status" class="status loading" role="status" aria-live="polite">
    <div class="status-card">
      <div class="status-icon" aria-hidden="true">+</div>
      <h1 id="status-title">Preparando seu atendimento</h1>
      <p id="status-message">Estamos abrindo a TeleSaúde em uma página exclusiva.</p>
      <a id="retry" href="/telesaude/" hidden>Voltar e acessar novamente</a>
    </div>
  </section>
</main>
<nav class="space-footer" hidden aria-label="Acesso ao Meu Espaço de Saúde">
  <a class="space-entry" href="/telesaude/meu-espaco/" target="_blank" rel="noopener noreferrer"
     aria-label="Abrir Meu Espaço de Saúde em outra aba, sem encerrar o atendimento">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 8a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <path d="M12 17s-3.3-1.9-3.3-4.1a1.8 1.8 0 0 1 3.3-1 1.8 1.8 0 0 1 3.3 1C15.3 15.1 12 17 12 17z"/>
    </svg>
    <span class="space-entry-copy"><strong>Meu Espaço de Saúde</strong><small>Informações e documentos para suas consultas</small></span>
    <svg class="space-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
  </a>
</nav>
<script>
(function(){
  "use strict";
  const HANDOFF_KEY="promovie:mediquo:handoff:v1";
  const status=document.getElementById("status");
  const title=document.getElementById("status-title");
  const message=document.getElementById("status-message");
  const retry=document.getElementById("retry");
  const SDK_SOURCE="https://widget.mediquo.com/js/1.0.0/mediquo.js";

  function errorState(text){
    status.hidden=false;
    status.classList.remove("loading");
    title.textContent="Não foi possível abrir o atendimento";
    message.textContent=text;
    retry.hidden=false;
  }

  function receiveOnce(){
    let raw=null;
    try{
      raw=window.sessionStorage.getItem(HANDOFF_KEY);
      window.sessionStorage.removeItem(HANDOFF_KEY);
    }catch{return null;}
    if(!raw)return null;
    try{
      const data=JSON.parse(raw);
      if(!data||typeof data!=="object"||
         typeof data.apiKey!=="string"||!data.apiKey||
         typeof data.accessToken!=="string"||!data.accessToken||
         data.environment!=="production"||
         typeof data.createdAt!=="number"||
         Date.now()-data.createdAt>60000||
         data.createdAt-Date.now()>10000)return null;
      return data;
    }catch{return null;}
  }

  function loadSdk(){
    return new Promise(function(resolve,reject){
      const script=document.createElement("script");
      script.src=SDK_SOURCE;
      script.async=true;
      const timeout=setTimeout(function(){
        script.remove();reject(new Error("O atendimento não respondeu."));
      },20000);
      script.onload=function(){
        clearTimeout(timeout);
        if(window.MediquoWidget&&typeof window.MediquoWidget.init==="function"){
          resolve(window.MediquoWidget);
        }else{reject(new Error("O atendimento está indisponível."));}
      };
      script.onerror=function(){
        clearTimeout(timeout);reject(new Error("A conexão com o atendimento falhou."));
      };
      document.head.appendChild(script);
    });
  }

  async function openAttendance(){
    const handoff=receiveOnce();
    if(!handoff){
      errorState("Por segurança, abra a TeleSaúde pelo formulário de CPF e código. Esta página não conserva sua senha ou sessão após atualizar.");
      return;
    }
    try{
      const widget=await loadSdk();
      await Promise.resolve(widget.init({
        apiKey:handoff.apiKey,
        accessToken:handoff.accessToken,
        adapter:"web",
        environment:"production",
        show:"always",
        isMobileView:true,
        theme:{
          launcher:"hidden",locale:"pt",hideCloseButton:"true",
          text:{title:"Médicos e Especialistas"},
          colors:{primary:"#4b0c8f"}
        }
      }));
      if(typeof widget.open!=="function")throw new Error("Não foi possível abrir a interface de atendimento.");
      await Promise.resolve(widget.open());
      status.hidden=true;
    }catch{
      errorState("Não conseguimos carregar a TeleSaúde nesta página. Retorne ao acesso e tente novamente.");
    }
  }
  openAttendance();
})();
</script>
</body>
</html>
