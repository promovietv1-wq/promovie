<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Meus Agendamentos | Telessaúde</title>
<style>
:root{font-family:Inter,Arial,system-ui,sans-serif;color-scheme:light;background:#fff;color:#302349}
*{box-sizing:border-box}
html,body{height:100%;height:100dvh;margin:0;background:#fff;overflow:hidden}
header{height:59px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px max(13px,env(safe-area-inset-right)) 9px max(13px,env(safe-area-inset-left));border-bottom:1px solid #e7dfef;background:#fff}
header strong{font-size:14px;color:#491e9c;font-weight:800;letter-spacing:-.02em}
button{min-width:87px;min-height:39px;border:1px solid #daccea;border-radius:11px;color:#491e9c;background:#fff;font:700 13px Inter,Arial,sans-serif;cursor:pointer}
button:hover{background:#f7f2fd}
button:focus-visible{outline:3px solid #7837d9;outline-offset:2px}
main{position:relative;height:calc(100vh - 59px);height:calc(100dvh - 59px);overflow:hidden;background:#fff}
iframe{position:absolute;inset:0;border:0;display:block;width:100%;height:100%;background:#fff;color-scheme:light;filter:invert(1) hue-rotate(180deg) brightness(1.04)}
/* O painel remoto apresenta um alternador de tema escuro. A máscara evita
   ativar acidentalmente o tema escuro na versão visualmente clara PromoVie. */
.theme-cover{position:absolute;right:0;top:0;width:79px;height:76px;pointer-events:auto;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 52%);z-index:1}
@media(max-width:390px){header strong{font-size:13px}.theme-cover{width:71px}}
</style>
</head>
<body>
<header><strong>Meus Agendamentos</strong><button id="pv-appointments-back" type="button">Voltar</button></header>
<main aria-label="Painel de Meus Agendamentos em visualização clara">
  <iframe id="pv-appointments-external" title="Consultar, cancelar e remarcar agendamentos" loading="eager" referrerpolicy="no-referrer"></iframe>
  <div class="theme-cover" aria-hidden="true"></div>
</main>
<script>
(function(){
  "use strict";
  const iframe=document.getElementById("pv-appointments-external");
  // O próprio site original mantém as operações e os dados. Não temos
  // acesso ao seu DOM ou a suas credenciais por causa da origem distinta.
  iframe.contentWindow.location.replace("https://painel-agendazap.vercel.app/");
  document.getElementById("pv-appointments-back").addEventListener("click",function(){
    if(window.parent!==window){
      window.parent.postMessage({type:"pv-appointments-close"},location.origin);
      return;
    }
    try{
      const previous=new URL(document.referrer);
      if(previous.origin===location.origin&&history.length>1){history.back();return;}
    }catch{}
    location.assign("/telessaude/teste-aceite/");
  });
})();
</script>
</body>
</html>
